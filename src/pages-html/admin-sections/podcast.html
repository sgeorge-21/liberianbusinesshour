      
        <div class="admin-card">
          <div class="admin-card-header">Upload Podcast Episode</div>
          <div class="admin-card-body">
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Episode Title *</label><input type="text" id="podTitle" placeholder="e.g. 2026 Budget Analysis: What Business Must Know"></div>
              <div class="admin-form-group"><label>Episode Number</label><input type="number" placeholder="e.g. 49" min="1"></div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Air Date</label><input type="date"></div>
              <div class="admin-form-group"><label>Duration (minutes)</label><input type="number" placeholder="45" min="1"></div>
            </div>
            <div class="admin-form-group"><label>Episode Description *</label><textarea id="podDesc" placeholder="Describe what this episode covers..."></textarea></div>
            <div class="admin-form-group"><label>Show Notes / Transcript</label><textarea style="height:160px;" placeholder="Full show notes, guest names, timestamps, links..."></textarea></div>
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Audio File (MP3/WAV)</label>
                <div class="file-upload-area">
                  <div class="upload-icon">🎙️</div>
                  <p>Click to upload audio recording</p>
                  <span>MP3 or WAV · Max 200MB</span>
                  <input type="file" accept="audio/*">
                </div>
              </div>
              <div class="admin-form-group"><label>Episode Thumbnail</label>
                <div class="file-upload-area">
                  <div class="upload-icon">🖼️</div>
                  <p>Click to upload episode image</p>
                  <span>JPG or PNG · 600×600px recommended</span>
                  <input type="file" accept="image/*">
                </div>
              </div>
            </div>
            <div class="admin-form-group"><label>Platforms (select all that apply)</label>
              <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:.5rem;">
                <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;font-size:13.5px;"><input type="checkbox" checked> Website</label>
                <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;font-size:13.5px;"><input type="checkbox"> Spotify</label>
                <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;font-size:13.5px;"><input type="checkbox"> Apple Podcasts</label>
                <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;font-size:13.5px;"><input type="checkbox"> YouTube</label>
              </div>
            </div>
            <div class="admin-btn-row">
              <button class="btn-cancel">Cancel</button>
              <button class="btn-save-draft">Save as Draft</button>
              <button class="btn-publish">Publish Episode →</button>
            </div>
          </div>
        </div>
      </div>
