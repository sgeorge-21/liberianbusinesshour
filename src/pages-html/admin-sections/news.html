      
        <div class="admin-card">
          <div class="admin-card-header">Publish News Article or Story</div>
          <div class="admin-card-body">
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Article Title *</label><input type="text" id="newsTitle" placeholder="Enter headline..."></div>
              <div class="admin-form-group"><label>Category *</label><select id="newsCat"><option>Business</option><option>Economy</option><option>Finance</option><option>Trade</option><option>Agriculture</option><option>Entrepreneurship</option><option>Feature</option><option>Opinion</option><option>Investigative</option></select></div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Author Name</label><input type="text" placeholder="e.g. James T. Worquea III"></div>
              <div class="admin-form-group"><label>Read Time (minutes)</label><input type="number" placeholder="5" min="1"></div>
            </div>
            <div class="admin-form-group"><label>Summary / Excerpt *</label><textarea id="newsSummary" placeholder="Write a short summary that appears on listing pages..."></textarea></div>
            <div class="admin-form-group"><label>Full Article Body</label><textarea style="height:200px;" placeholder="Write the full article content here..."></textarea></div>
            <div class="admin-form-group"><label>Cover Image</label>
              <div class="file-upload-area">
                <div class="upload-icon">📷</div>
                <p>Click to upload cover image</p>
                <span>JPG, PNG up to 5MB · Recommended: 1200×800px</span>
                <input type="file" accept="image/*">
              </div>
            </div>
            <div class="admin-form-row">
              <div class="admin-form-group"><label>Tags (comma-separated)</label><input type="text" placeholder="e.g. CBL, digital currency, banking"></div>
              <div class="admin-form-group"><label>Featured?</label><select><option>No</option><option>Yes – Homepage Hero</option><option>Yes – Section Feature</option></select></div>
            </div>
            <div class="admin-btn-row">
              <button class="btn-cancel">Cancel</button>
              <button class="btn-save-draft">Save as Draft</button>
              <button class="btn-publish">Publish Now →</button>
            </div>
          </div>
        </div>
      </div>
